services:
  postgres:
    image: postgres:16-alpine
    container_name: rac-postgres
    environment:
      POSTGRES_DB: rac_togo
      POSTGRES_USER: rac_user
      POSTGRES_PASSWORD: rac_secure_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rac_user -d rac_togo"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rac-network

  redis:
    image: redis:7-alpine
    container_name: rac-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    networks:
      - rac-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rac-backend
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file: ./backend/.env
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/storage
    networks:
      - rac-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rac-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - rac-network

  # Service worker pour Laravel Horizon / Queues
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rac-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file: ./backend/.env
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/storage
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    networks:
      - rac-network

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rac-scheduler
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file: ./backend/.env
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/storage
    command: php artisan schedule:work
    networks:
      - rac-network

volumes:
  pgdata:
  redisdata:

networks:
  rac-network:
    driver: bridge
